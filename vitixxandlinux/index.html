<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitixx hates Linux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f4f1ff;
    --muted: #b9b3d9;
    --accent: #ff5ea8;
    --accent-2: #7cc6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #03020a;
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
  }

  /* Nebula layers behind the stars */
  .nebula {
    position: fixed; inset: -20%;
    background:
      radial-gradient(ellipse 40% 30% at 25% 35%, rgba(140, 60, 220, 0.35), transparent 70%),
      radial-gradient(ellipse 35% 25% at 75% 60%, rgba(255, 70, 150, 0.22), transparent 70%),
      radial-gradient(ellipse 50% 35% at 55% 20%, rgba(40, 110, 255, 0.25), transparent 70%),
      radial-gradient(ellipse 30% 40% at 15% 80%, rgba(0, 200, 200, 0.15), transparent 70%);
    filter: blur(20px);
    animation: drift 60s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: rotate(0deg) scale(1); }
    to   { transform: rotate(8deg) scale(1.08); }
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  main {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 16px;
    gap: 1.4rem;
  }
  h1 {
    font-family: "Orbitron", sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 8vw, 6.5rem);
    line-height: 1.05;
    background: linear-gradient(90deg, var(--accent-2), #fff, var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 25px rgba(180, 120, 255, 0.55));
    animation: shimmer 6s linear infinite, fadeUp 1.2s ease-out both;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  .line {
    font-size: clamp(1.1rem, 3.4vw, 2rem);
    color: var(--muted);
    animation: fadeUp 1.2s ease-out both;
  }
  .line strong { color: var(--text); font-weight: 600; }
  .line.one { animation-delay: 1.1s; }
  .line.two { animation-delay: 2.2s; }
  .line.two strong {
    color: var(--accent);
    text-shadow: 0 0 18px rgba(255, 94, 168, 0.6);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula, h1, .line { animation: none; }
  }
</style>
</head>
<body>
  <div class="nebula"></div>
  <canvas id="sky"></canvas>

  <main>
    <h1>Vitixx hates Linux...</h1>
    <p class="line one"><strong>17</strong> time(s) on paper (actually only 5 times because he said it on purpose)</p>
    <p class="line two"><strong>more times out loud</strong> than stars in the universe</p>
  </main>

<script>
  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, stars = [], shooters = [];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.floor((w * h) / 1800);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() ** 3 * 1.8 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 2,
      hue: [220, 260, 300, 40][Math.floor(Math.random() * 4)],
      drift: Math.random() * 0.03 + 0.005,
    }));
  }

  function spawnShooter() {
    shooters.push({
      x: Math.random() * w * 0.8,
      y: Math.random() * h * 0.4,
      vx: 8 + Math.random() * 6,
      vy: 3 + Math.random() * 3,
      life: 1,
    });
  }

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    const time = t / 1000;

    for (const s of stars) {
      if (!reduced) { s.x -= s.drift; if (s.x < 0) s.x = w; }
      const twinkle = reduced ? 0.8 : 0.5 + 0.5 * Math.sin(time * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue}, 80%, 90%, ${0.3 + twinkle * 0.7})`;
      ctx.fill();
      if (s.r > 1.4) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 90%, 80%, ${twinkle * 0.08})`;
        ctx.fill();
      }
    }

    if (!reduced && Math.random() < 0.006) spawnShooter();
    shooters = shooters.filter(m => m.life > 0);
    for (const m of shooters) {
      const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      grad.addColorStop(0, `rgba(255,255,255,${m.life})`);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12);
      ctx.stroke();
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
    }

    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
</script>
</body>
</html>
